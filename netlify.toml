[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# PUBLIC_WEB3FORMS_KEY must be set in the Netlify dashboard:
# Site settings → Environment variables → Add a variable
# Key: PUBLIC_WEB3FORMS_KEY  Value: (your Web3Forms access key)

# Long cache for hashed assets (CSS/JS in _astro have content hashes in filenames)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security + performance headers for HTML
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"
